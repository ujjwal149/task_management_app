version: "3.9"

services:
  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api

    container_name: taskflow-client
    ports:
      - "3000:3000"
    depends_on:
      - server

  server:
    build:
      context: ./server
    container_name: taskflow-server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env